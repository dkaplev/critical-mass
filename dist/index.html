<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#85cfc8"><meta name="description" content="One tap. A whole chain of consequences. Play handcrafted and endlessly generated Critical Mass puzzles."><title>Critical Mass</title><link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css"></head><body>
<main class="game"><header><button id="levels" class="wordmark" aria-label="Choose a level"><span class="brand-symbol">✳</span> CRITICAL MASS</button><div class="header-actions"><button id="help" class="icon" aria-label="How to play and tile guides">?</button><button id="settings" class="icon" aria-label="Pause and settings"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button></div></header>
<section class="level-heading"><div><button id="levelLabel" class="eyebrow">PUZZLE 01 / 12 <span>⌄</span></button><h1 id="title">First contact</h1></div><div class="par"><span>GOLD PAR</span><strong id="par">02</strong></div></section>
<section class="dashboard"><div><span>TAPS LEFT</span><strong id="taps">04</strong></div><div class="target-stat"><span>TARGETS</span><strong><span id="targetCount">0 / 1</span><i class="mini-target"></i></strong></div><div><span id="chainGoal">CHAIN GOAL</span><strong id="best">00</strong></div></section>
<section class="play-area"><div class="board-frame"><div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div><div id="board" aria-label="Puzzle board"></div><canvas id="magic" aria-hidden="true"></canvas><svg id="flights" aria-hidden="true"></svg><div id="chain" aria-live="off"><strong>0</strong><span>CHAIN REACTION</span></div></div><div class="board-caption"><span id="gridSize">3 × 3</span><span id="status">SYSTEM READY</span><span id="waveLabel">● LIVE</span></div></section>
<div class="instruction" id="instruction" aria-live="polite">Tap a cell.</div>
<nav class="power-tray" aria-label="Super powers"><button id="nova"><b>✺</b><span>Nova<small>+1 to every tile</small></span><em id="novaCount">3</em></button><button id="rowPower"><b>↔</b><span>Row sweep<small>Clear a target row</small></span><em id="rowCount">3</em></button></nav><button id="powers" class="power-info">Power guide & refills</button><nav class="controls" aria-label="Game controls"><button id="undo"><svg viewBox="0 0 24 24"><path d="M9 5 4 10l5 5M4 10h10a5 5 0 0 1 0 10"/></svg>Undo</button><button id="restart"><svg viewBox="0 0 24 24"><path d="M19 8a8 8 0 1 0 1 7M19 3v5h-5"/></svg>Restart</button><button id="sound" aria-label="Toggle sound"><svg viewBox="0 0 24 24"><path d="m11 4-6 5H2v6h3l6 5ZM15 8q5 4 0 8M18 4q9 8 0 16"/></svg><span>Sound on</span></button></nav>
<button id="skip" hidden>Skip cascade ↗</button><div class="progress" id="progress" aria-label="Level progress"></div><pre id="debug" hidden></pre>
</main>
<dialog id="modal"><div id="modalContent"></div></dialog><script type="module" src="app.mjs"></script></body></html>
